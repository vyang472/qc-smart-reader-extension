name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Full validation (macOS)
    runs-on: macos-15
    timeout-minutes: 35
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      QC_REQUIRE_BROWSER: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install hash-verified Python dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install \
            --require-hashes \
            --only-binary=:all: \
            --requirement requirements.lock

      - name: Install locked Node.js test tools
        run: npm ci --ignore-scripts

      - name: Install pinned Codex CLI contract dependency
        run: |
          npm install \
            --prefix /tmp/qc-codex-cli \
            --ignore-scripts \
            --no-save \
            --registry https://registry.npmjs.org \
            @openai/codex@0.145.0
          printf '%s\n' '/tmp/qc-codex-cli/node_modules/.bin' >> "$GITHUB_PATH"

      - name: Install Chromium
        run: npx --no-install playwright install chromium

      - name: Record pinned tool versions
        run: |
          node --version
          npx --no-install playwright --version
          codex --version
          .venv/bin/python --version

      - name: Run the zero-skip validation gate
        env:
          QC_TEST_PYTHON: ${{ github.workspace }}/.venv/bin/python
        run: npm test

  release-contract:
    name: Deterministic release contract
    needs: validate
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Validate and reproduce release archives
        run: |
          test "$(node -p 'require("./package.json").version')" = \
            "$(node -p 'require("./manifest.json").version')"
          python scripts/release.py --check
          python scripts/release.py --output-dir dist/release-a
          python scripts/release.py --output-dir dist/release-b
          diff -rq dist/release-a dist/release-b
          (cd dist/release-a && shasum -a 256 -c SHA256SUMS)

      - name: Upload release candidate
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qc-smart-reader-release-candidate
          path: dist/release-a/*
          if-no-files-found: error
          retention-days: 14
