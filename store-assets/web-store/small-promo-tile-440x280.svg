  <path d="M268 82C306 82 306 118 337 118C369 118 370 154 337 154C306 154 306 198 268 198" fill="none" stroke="url(#chain)" stroke-width="4" stroke-linecap="round"/>
  <circle cx="304" cy="97" r="5" fill="#5FA5FF" stroke="#102D4C" stroke-width="3"/>
  <circle cx="355" cy="136" r="5" fill="#39C7A0" stroke="#103B3C" stroke-width="3"/>
  <circle cx="304" cy="183" r="5" fill="#32C391" stroke="#103B3C" stroke-width="3"/>

