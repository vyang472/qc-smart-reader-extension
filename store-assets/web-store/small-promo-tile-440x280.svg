    <rect x="39" y="73" width="134" height="134" rx="33" fill="none" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="2"/>
    <circle cx="102" cy="136" r="36" fill="none" stroke="#FFFFFF" stroke-width="16"/>
    <path d="M124 158 148 182" fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round"/>
