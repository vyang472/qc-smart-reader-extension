<svg xmlns="http://www.w3.org/2000/svg" width="440" height="280" viewBox="0 0 440 280" role="img" aria-labelledby="title desc">
  <title id="title">QC Smart Reader promotional artwork</title>
  <desc id="desc">The QC blue and green icon beside a connected source, claim, and verified evidence chain.</desc>
  <defs>
    <linearGradient id="background" x1="20" y1="18" x2="420" y2="266" gradientUnits="userSpaceOnUse">
      <stop stop-color="#071426"/>
      <stop offset="0.56" stop-color="#0B2442"/>
      <stop offset="1" stop-color="#073B36"/>
    </linearGradient>
    <linearGradient id="brand" x1="48" y1="74" x2="171" y2="207" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1267E3"/>
      <stop offset="1" stop-color="#087A58"/>
    </linearGradient>
    <linearGradient id="chain" x1="261" y1="71" x2="348" y2="213" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3B8FFF"/>
      <stop offset="1" stop-color="#22C58B"/>
    </linearGradient>
    <radialGradient id="blueGlow" cx="0" cy="0" r="1" gradientTransform="translate(86 85) rotate(50) scale(157 153)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2D84F7" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#2D84F7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="greenGlow" cx="0" cy="0" r="1" gradientTransform="translate(374 229) rotate(-132) scale(173 153)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0BB07B" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#0BB07B" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="190%">
      <feDropShadow dx="0" dy="12" stdDeviation="13" flood-color="#020812" flood-opacity="0.4"/>
    </filter>
    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#020812" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="440" height="280" fill="url(#background)"/>
  <rect width="440" height="280" fill="url(#blueGlow)"/>
  <rect width="440" height="280" fill="url(#greenGlow)"/>
  <circle cx="409" cy="18" r="91" fill="none" stroke="#3B8FFF" stroke-opacity="0.09" stroke-width="34"/>
  <circle cx="29" cy="269" r="77" fill="none" stroke="#22C58B" stroke-opacity="0.07" stroke-width="28"/>
  <path d="M0 235C73 211 109 261 180 240S293 208 440 246V280H0Z" fill="#FFFFFF" opacity="0.025"/>

